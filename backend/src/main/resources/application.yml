spring:
  datasource:
    url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:diapptrack}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
    username: ${MYSQLUSER:root}
    password: ${MYSQLPASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 86400s  # 24 horas

  security:
    remember-me:
      key: ${REMEMBER_ME_KEY:diapptrack-secret-key-change-in-prod}
      token-validity-seconds: 2592000  # 30 días

  jackson:
    time-zone: America/Lima

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
  project-id: diapptrack

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  glucose:
    low-threshold: 70
    high-threshold: 180
  patient-active-days: 7
  upload-dir: ${UPLOAD_DIR:uploads}
